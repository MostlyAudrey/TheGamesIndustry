<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MappingItAll — Games Industry Power Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242838;
  --border: #2d3246;
  --text: #e1e4f0;
  --text-dim: #8b90a0;
  --accent: #6c8cff;
  --accent2: #50c878;
  --accent3: #ff6b6b;
  --danger: #ff4757;
  --warn: #ffa502;
  --radius: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* Header */
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; white-space: nowrap; }
header h1 span { color: var(--text-dim); font-weight: 400; }
#search-wrap { flex: 1; min-width: 200px; position: relative; }
#search { width: 100%; padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; outline: none; }
#search:focus { border-color: var(--accent); }
#search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); max-height: 300px; overflow-y: auto; display: none; z-index: 100; }
#search-results.show { display: block; }
.search-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
.search-item:hover { background: var(--surface2); }
.search-item .name { font-size: 14px; }
.search-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* Filters */
#filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all 0.15s; }
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
#stats { font-size: 12px; color: var(--text-dim); white-space: nowrap; }

#main { display: flex; flex: 1; overflow: hidden; }

#graph-wrap { flex: 1; position: relative; }
#graph { width: 100%; height: 100%; }
#graph svg { width: 100%; height: 100%; }
.loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--text-dim); font-size: 16px; }

#tooltip { position: absolute; display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; max-width: 250px; pointer-events: none; z-index: 50; box-shadow: var(--shadow); }
#tooltip.show { display: block; }
#tooltip .tt-name { font-weight: 600; font-size: 14px; }
#tooltip .tt-type { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* Detail Panel */
#detail { width: 0; overflow: hidden; background: var(--surface); border-left: 1px solid var(--border); transition: width 0.2s; flex-shrink: 0; }
#detail.open { width: 380px; }
#detail-inner { width: 380px; height: 100%; overflow-y: auto; padding: 20px; padding-top: 16px; position: relative; }
.detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.detail-top h2 { font-size: 18px; margin: 0; flex: 1; }
#detail-close { flex-shrink: 0; background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
#detail-close:hover { color: var(--text); border-color: var(--accent); }
.detail-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.detail-meta span { background: var(--surface2); padding: 2px 8px; border-radius: 4px; }
.detail-summary { font-size: 13px; line-height: 1.5; margin: 12px 0; color: var(--text); }
.detail-section { margin-top: 16px; }
.detail-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--accent); }
.detail-link { display: block; padding: 6px 10px; margin-bottom: 4px; background: var(--surface2); border-radius: 4px; cursor: pointer; font-size: 13px; transition: background 0.15s; }
.detail-link:hover { background: var(--border); }
.detail-link .link-type { font-size: 11px; color: var(--text-dim); }

#legend { position: absolute; bottom: 16px; right: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 11px; line-height: 1.6; max-width: 160px; z-index: 10; }
#legend .legend-title { font-weight: 600; margin-bottom: 4px; font-size: 11px; color: var(--text-dim); }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 768px) {
  header { flex-direction: column; align-items: stretch; }
  #detail.open { width: 100%; }
  #detail-inner { width: 100%; }
}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>MappingItAll<span> ▲</span></h1>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search people, companies, events..." autocomplete="off">
      <div id="search-results"></div>
    </div>
    <div id="filters">
      <span id="stats"></span>
      <button class="filter-btn active" data-type="all">All</button>
      <button class="filter-btn" data-type="org">Orgs</button>
      <button class="filter-btn" data-type="person">People</button>
      <button class="filter-btn" data-type="event">Events</button>
    </div>
  </header>

  <div id="main">
    <div id="graph-wrap">
      <div class="loading">Loading graph data...</div>
      <div id="graph"></div>
      <div id="legend">
        <div class="legend-title">Node Types</div>
      </div>
      <div id="tooltip"></div>
    </div>
    <div id="detail">
      <div id="detail-inner"></div>
    </div>
  </div>
</div>

<script>
// ====== Color scheme ======
const COLORS = {
  'org': '#6c8cff',
  'Publisher': '#4a7cf7',
  'Studio': '#50c878',
  'PE Fund': '#ff6b6b',
  'VC Fund': '#ffa502',
  'Sovereign Wealth Fund': '#ff4757',
  'Pension Fund': '#ff6b6b',
  'Union': '#e74cee',
  'person': '#ffa502',
  'event': '#ff6b6b',
  'layoff': '#ff4757',
  'acquisition': '#6c8cff',
  'strike': '#e74cee',
  'source': '#8b90a0',
  'default': '#8b90a0',
};

function getColor(node) {
  if (node.dir === 'sources') return COLORS.source;
  if (node.dir === 'people') return COLORS.person;
  if (node.dir === 'events') {
    const t = (node.eventType || '').toLowerCase();
    if (t.includes('layoff') || t.includes('closure')) return COLORS.layoff;
    if (t.includes('strike') || t.includes('union')) return COLORS.strike;
    if (t.includes('acquisition') || t.includes('deal')) return COLORS.acquisition;
    return COLORS.event;
  }
  if (COLORS[node.displayType]) return COLORS[node.displayType];
  if (COLORS[node.type]) return COLORS[node.type];
  return COLORS.default;
}

// Colors for edge types
const EDGE_COLORS = {
  'portfolio-of': '#ff6b6b',
  'lp-in': '#ffa502',
  'involves': '#6c8cff',
};

// ====== State ======
let allNodes = [];
let allEdges = [];
let activeFilter = 'all';
let selectedNode = null;
let highlightNode = null;
let simulation = null;
let svg, linkG, nodeG, labelG;

// ====== Load data ======
async function loadData() {
  try {
    const resp = await fetch('data/graph.json');
    const graphData = await resp.json();
    allNodes = graphData.nodes;
    allEdges = graphData.edges;
    document.querySelector('.loading').style.display = 'none';
    init();
    updateStats();
    buildSearchIndex();
  } catch(e) {
    document.querySelector('.loading').textContent = 'Error loading graph data: ' + e.message;
  }
}

// ====== Init ======
function init() {
  const wrap = document.getElementById('graph-wrap');
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;

  svg = d3.select('#graph')
    .append('svg')
    .attr('width', width)
    .attr('height', height)
    .call(d3.zoom().scaleExtent([0.1, 4]).on('zoom', (event) => {
      svg.select('g').attr('transform', event.transform);
    }));

  // Arrow marker
  svg.append('defs').append('marker')
    .attr('id', 'arrowhead')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 20)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', 'var(--border)');

  renderGraph();
  buildLegend();

  window.addEventListener('resize', () => {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    svg.attr('width', w).attr('height', h);
  });
}

// ====== Search index ======
let searchIndex = [];
function buildSearchIndex() {
  searchIndex = allNodes.map(n => ({
    id: n.id,
    name: n.name,
    type: n.displayType || n.type,
    dir: n.dir,
    sector: n.sector,
    region: n.region,
    role: n.role,
  }));
}

// ====== Render graph ======
function renderGraph() {
  const wrap = document.getElementById('graph-wrap');
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;

  // ---- Filter logic ----
  // Map short filter names to actual dir values in the data
  const filterDirMap = { 'org': 'orgs', 'person': 'people', 'event': 'events' };
  let visibleNodeIds;

  if (activeFilter === 'all') {
    visibleNodeIds = new Set(allNodes.map(n => n.id));
  } else {
    const dirName = filterDirMap[activeFilter] || activeFilter;
    const typeNodes = allNodes.filter(n => n.dir === dirName);
    visibleNodeIds = new Set(typeNodes.map(n => n.id));
    // Expand to include connected nodes so edges are visible
    for (const e of allEdges) {
      if (visibleNodeIds.has(e.source)) visibleNodeIds.add(e.target);
      if (visibleNodeIds.has(e.target)) visibleNodeIds.add(e.source);
    }
  }

  // If a specific node is selected, show only its neighborhood within current filter
  if (highlightNode) {
    const connected = new Set([highlightNode.id]);
    for (const e of allEdges) {
      if (e.source === highlightNode.id || e.target === highlightNode.id) {
        connected.add(e.source);
        connected.add(e.target);
      }
    }
    visibleNodeIds = new Set([...visibleNodeIds].filter(id => connected.has(id)));
  }

  const filteredNodes = allNodes.filter(n => visibleNodeIds.has(n.id));
  const filteredEdges = allEdges.filter(e =>
    visibleNodeIds.has(e.source) && visibleNodeIds.has(e.target)
  );

  // ---- Build simulation ----
  if (simulation) simulation.stop();

  const nodeData = filteredNodes.map(n => ({ ...n }));
  const nodeMap = {};
  nodeData.forEach((n, i) => nodeMap[n.id] = i);

  const linkData = filteredEdges.map(e => ({
    source: nodeMap[e.source],
    target: nodeMap[e.target],
    type: e.type,
  })).filter(l => l.source !== undefined && l.target !== undefined);

  // Ensure a <g> exists
  let graphG = svg.select('g');
  if (graphG.empty()) {
    graphG = svg.append('g');
  }
  graphG.selectAll('*').remove();

  simulation = d3.forceSimulation(nodeData)
    .force('link', d3.forceLink(linkData).id(d => d.id).distance(80))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(20));

  // ---- Links ----
  linkG = graphG.append('g')
    .selectAll('line')
    .data(linkData)
    .join('line')
    .attr('stroke', d => EDGE_COLORS[d.type] || 'var(--border)')
    .attr('stroke-width', d => d.type === 'portfolio-of' || d.type === 'lp-in' ? 2 : 0.8)
    .attr('stroke-opacity', d => d.type === 'portfolio-of' || d.type === 'lp-in' ? 0.8 : 0.3)
    .attr('marker-end', d => d.type === 'portfolio-of' || d.type === 'lp-in' ? 'url(#arrowhead)' : null);

  // ---- Nodes ----
  nodeG = graphG.append('g')
    .selectAll('circle')
    .data(nodeData)
    .join('circle')
    .attr('r', d => {
      if (d.dir === 'sources') return 3;
      if (d.dir === 'people') return 7;
      if (d.dir === 'events') return 6;
      if (d.dir === 'orgs') return Math.min(10, 5 + (d.edgeCount || 0) * 0.3);
      return 5;
    })
    .attr('fill', d => getColor(d))
    .attr('stroke', d => d === selectedNode ? '#fff' : 'none')
    .attr('stroke-width', 2)
    .style('cursor', 'pointer')
    .on('mouseover', (event, d) => showTooltip(event, d))
    .on('mouseout', hideTooltip)
    .on('click', (event, d) => {
      event.stopPropagation();
      selectNode(d);
    })
    .call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (event, d) => {
        d.fx = event.x; d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      }));

  // ---- Labels ----
  labelG = graphG.append('g')
    .selectAll('text')
    .data(nodeData.filter(d => d.dir !== 'sources' && d.dir !== 'events'))
    .join('text')
    .text(d => d.name.length > 20 ? d.name.substring(0, 18) + '…' : d.name)
    .attr('font-size', d => d.dir === 'orgs' ? 10 : 11)
    .attr('dx', d => (d.dir === 'orgs' ? 14 : 12))
    .attr('dy', 4)
    .attr('fill', 'var(--text-dim)')
    .style('pointer-events', 'none')
    .style('font-family', 'system-ui, sans-serif');

  // ---- Tick ----
  simulation.on('tick', () => {
    linkG
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    nodeG
      .attr('cx', d => d.x)
      .attr('cy', d => d.y);
    labelG
      .attr('x', d => d.x)
      .attr('y', d => d.y);
  });

  // Click background to deselect
  svg.on('click', () => selectNode(null));
}

// ====== Search ======
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  const results = document.getElementById('search-results');
  if (!q || q.length < 2) {
    results.classList.remove('show');
    return;
  }

  const matches = searchIndex.filter(e =>
    e.name.toLowerCase().includes(q) ||
    (e.role && e.role.toLowerCase().includes(q))
  ).slice(0, 20);

  results.innerHTML = matches.map(m => {
    const idx = m.name.toLowerCase().indexOf(q);
    const display = idx >= 0
      ? m.name.substring(0, idx) + '<strong>' + m.name.substring(idx, idx + q.length) + '</strong>' + m.name.substring(idx + q.length)
      : m.name;
    return '<div class="search-item" data-id="' + m.id + '">' +
      '<div class="name">' + display + '</div>' +
      '<div class="meta">' + m.type + (m.sector ? ' · ' + m.sector : '') + (m.region ? ' · ' + m.region : '') + '</div>' +
      '</div>';
  }).join('');

  results.classList.toggle('show', matches.length > 0);

  results.querySelectorAll('.search-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const node = allNodes.find(n => n.id === id);
      if (node) {
        document.getElementById('search').value = '';
        results.classList.remove('show');
        selectNode(node);
      }
    });
  });
});

// ====== Tooltip ======
function showTooltip(event, d) {
  const tip = document.getElementById('tooltip');
  tip.innerHTML = '<div class="tt-name">' + d.name + '</div>' +
    '<div class="tt-type">' + (d.displayType || d.type) + (d.region ? ' · ' + d.region : '') + (d.role ? ' · ' + d.role : '') + '</div>' +
    (d.summary ? '<div style="margin-top:4px;font-size:12px;color:var(--text-dim)">' + d.summary.substring(0, 120) + (d.summary.length > 120 ? '…' : '') + '</div>' : '');
  const rect = event.target.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top - 8;
  tip.style.left = Math.min(x, window.innerWidth - 260) + 'px';
  tip.style.top = Math.max(y, 10) + 'px';
  tip.classList.add('show');
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('show');
}

// ====== Detail panel ======
function selectNode(d) {
  selectedNode = d;
  const panel = document.getElementById('detail');
  const inner = document.getElementById('detail-inner');

  if (!d) {
    panel.classList.remove('open');
    highlightNode = null;
    renderGraph();
    return;
  }

  panel.classList.add('open');

  // Connections
  const connectedEdges = allEdges.filter(e => e.source === d.id || e.target === d.id);
  const connectedNodeIds = new Set();
  connectedEdges.forEach(e => { connectedNodeIds.add(e.source); connectedNodeIds.add(e.target); });
  connectedNodeIds.delete(d.id);
  const connectedNodes = [...connectedNodeIds].map(id => allNodes.find(n => n.id === id)).filter(Boolean);

  // Highlight neighborhood
  highlightNode = d;
  renderGraph();

  // ---- Build HTML ----
  let html = '<div class="detail-top"><h2>' + escapeHtml(d.name) + '</h2><button id="detail-close" onclick="selectNode(null)">✕ Close</button></div>';

  html += '<div class="detail-meta">';
  html += '<span>' + (d.displayType || d.type) + '</span>';
  if (d.priority) html += '<span>P' + d.priority + '</span>';
  if (d.confidence) html += '<span>' + d.confidence + '</span>';
  if (d.region) html += '<span>' + d.region + '</span>';
  if (d.sector) html += '<span>' + d.sector + '</span>';
  if (d.role) html += '<span>' + d.role + '</span>';
  if (d.ownership) html += '<span>' + d.ownership + '</span>';
  if (d.date) html += '<span>' + d.date + '</span>';
  html += '<span>' + connectedEdges.length + ' connections</span>';
  html += '</div>';

  if (d.summary) {
    html += '<div class="detail-summary">' + escapeHtml(d.summary) + '</div>';
  }

  // Key Decisions
  if (d.key_decisions && Array.isArray(d.key_decisions) && d.key_decisions.length > 0) {
    html += '<div class="detail-section"><h3>Key Decisions</h3>';
    (Array.isArray(d.key_decisions) ? d.key_decisions : [d.key_decisions]).forEach(dec => {
      html += '<div class="detail-link" style="font-size:12px;line-height:1.4">' + escapeHtml(dec) + '</div>';
    });
    html += '</div>';
  }

  // Labour
  if (d.labour) {
    html += '<div class="detail-section"><h3>Labour</h3>';
    if (d.labour.jobs) html += '<div class="detail-link">Job impact: ' + d.labour.jobs + '</div>';
    if (d.labour.affected) html += '<div class="detail-link">Affected: ' + d.labour.affected + '</div>';
    if (d.labour.reason) html += '<div class="detail-link">Reason: ' + d.labour.reason + '</div>';
    if (d.labour.status) html += '<div class="detail-link">Status: ' + d.labour.status + '</div>';
    if (d.labour.membership) html += '<div class="detail-link">Membership: ' + d.labour.membership + '</div>';
    if (d.labour.layoffs && Array.isArray(d.labour.layoffs)) {
      d.labour.layoffs.forEach(ly => html += '<div class="detail-link" style="color:var(--danger)">🔴 ' + ly + '</div>');
    }
    if (d.labour.hiring && Array.isArray(d.labour.hiring)) {
      d.labour.hiring.forEach(h => html += '<div class="detail-link" style="color:var(--accent2)">🟢 ' + h + '</div>');
    }
    html += '</div>';
  }

  // Portfolio (fund → studio)
  html += renderLinkList(d.portfolio, 'Portfolio');
  // LPs
  html += renderLinkList(d.lp, 'Limited Partners');
  // Actors
  html += renderActorList(d.actors);

  // Connected by type
  const orgConns = connectedNodes.filter(n => n.dir === 'orgs');
  const personConns = connectedNodes.filter(n => n.dir === 'people');
  const eventConns = connectedNodes.filter(n => n.dir === 'events');

  if (orgConns.length > 0) {
    html += '<div class="detail-section"><h3>Connected Organizations (' + orgConns.length + ')</h3>';
    orgConns.forEach(c => {
      html += '<div class="detail-link" onclick="clickNode(\'' + c.id.replace(/'/g, "\\'") + '\')">' + escapeHtml(c.name) + ' <span class="link-type">· ' + (c.displayType || c.type) + '</span></div>';
    });
    html += '</div>';
  }

  if (personConns.length > 0) {
    html += '<div class="detail-section"><h3>Connected People (' + personConns.length + ')</h3>';
    personConns.forEach(c => {
      html += '<div class="detail-link" onclick="clickNode(\'' + c.id.replace(/'/g, "\\'") + '\')">' + escapeHtml(c.name) + ' <span class="link-type">· ' + (c.role || c.displayType || c.type) + '</span></div>';
    });
    html += '</div>';
  }

  if (eventConns.length > 0) {
    html += '<div class="detail-section"><h3>Connected Events (' + eventConns.length + ')</h3>';
    eventConns.forEach(c => {
      html += '<div class="detail-link" onclick="clickNode(\'' + c.id.replace(/'/g, "\\'") + '\')">' + escapeHtml(c.name) + ' <span class="link-type">· ' + (c.eventType || c.displayType || c.type) + '</span></div>';
    });
    html += '</div>';
  }

  inner.innerHTML = html;
}

// Helper to render a list of [[wikilink]] strings as clickable links
function renderLinkList(items, label) {
  if (!items || !Array.isArray(items) || items.length === 0) return '';
  let html = '<div class="detail-section"><h3>' + label + '</h3>';
  items.forEach(raw => {
    const clean = raw.replace(/^\[\[|\]\]$/g, '');
    const found = findNodeByWikilink(clean);
    if (found) {
      html += '<div class="detail-link" onclick="clickNode(\'' + found.id.replace(/'/g, "\\'") + '\')">' + escapeHtml(found.name) + ' <span class="link-type">· ' + (found.displayType || found.type) + '</span></div>';
    } else {
      html += '<div class="detail-link" style="color:var(--text-dim)">' + escapeHtml(clean) + '</div>';
    }
  });
  html += '</div>';
  return html;
}

// Helper for actors list
function renderActorList(actors) {
  if (!actors || !Array.isArray(actors) || actors.length === 0) return '';
  let html = '<div class="detail-section"><h3>Actors</h3>';
  actors.forEach(raw => {
    const clean = raw.replace(/^\[\[|\]\]$/g, '');
    const found = findNodeByWikilink(clean);
    if (found) {
      html += '<div class="detail-link" onclick="clickNode(\'' + found.id.replace(/'/g, "\\'") + '\')">' + escapeHtml(found.name) + ' <span class="link-type">· ' + (found.displayType || found.type) + '</span></div>';
    } else {
      html += '<div class="detail-link" style="color:var(--text-dim)">' + escapeHtml(clean) + '</div>';
    }
  });
  html += '</div>';
  return html;
}

// Find a node by its base name from a [[wikilink]]
function findNodeByWikilink(clean) {
  // Try direct match on id suffix
  for (const n of allNodes) {
    if (n.id.endsWith('/' + clean) || n.id === clean) return n;
  }
  // Try fuzzy match on name
  const lc = clean.toLowerCase();
  for (const n of allNodes) {
    if (n.name.toLowerCase() === lc) return n;
    if (n.name.toLowerCase().includes(lc)) return n;
  }
  return null;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Global click handler for detail panel links
window.clickNode = function(id) {
  const n = allNodes.find(node => node.id === id);
  if (n) selectNode(n);
};

// ====== Stats ======
function updateStats() {
  const orgs = allNodes.filter(n => n.dir === 'orgs').length;
  const people = allNodes.filter(n => n.dir === 'people').length;
  const events = allNodes.filter(n => n.dir === 'events').length;
  const sources = allNodes.filter(n => n.dir === 'sources').length;
  document.getElementById('stats').textContent = orgs + ' orgs · ' + people + ' people · ' + events + ' events · ' + sources + ' sources';
}
